name: Site Up/Down Toggle

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Take the site down or bring it back up"
        required: true
        type: choice
        options:
          - down
          - up

jobs:
  toggle:
    name: Site ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Toggle site via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            if [ "${{ inputs.action }}" = "down" ]; then
              # Remove the allow rule, then explicitly deny the port
              # (ufw refuses to insert deny while an allow with the same spec exists)
              ufw delete allow 8080 || true
              ufw deny 8080
              # Stop the app and persist so a reboot doesn't bring it back
              pm2 stop eduassess
              pm2 save
              echo "Site is DOWN: port 8080 blocked, eduassess stopped."
            else
              ufw delete deny 8080 || true
              ufw allow 8080
              pm2 restart eduassess
              pm2 save
              echo "Site is UP: port 8080 open, eduassess running."
            fi
            ufw status | grep 8080
            pm2 status
